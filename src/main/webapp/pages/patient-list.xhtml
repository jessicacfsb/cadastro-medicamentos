<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/templates/template-sistema.xhtml">

	<ui:define name="content">
		
		<h:form id="patientForm">

			<p:growl id="messages" showDetail="true" life="4000" />

			<p:panel header="Cadastro de Pacientes" styleClass="cadastro-grid">
            <p:panelGrid columns="5" styleClass="ui-panelgrid-blank">
                <p:outputLabel for="name" value="Nome:" />
                <p:inputText id="name" value="#{patientBean.patient.fullName}" required="true" requiredMessage="Nome é obrigatório" maxlength="255" />
                
                <p:outputLabel for="birth" value="Data de nascimento:" />
                <p:datePicker id="birth" value="#{patientBean.patient.dateOfBirth}" pattern="dd/MM/yyyy" required="true" requiredMessage="Data de nascimento é obrigatória" />
                
                <p:commandButton id="btnSalvar" value="Salvar" icon="pi pi-save" actionListener="#{patientBean.save}" process="@this name birth" update="messages name birth patientTable" />
            </p:panelGrid>
        </p:panel>

			<p:panel header="Lista de Pacientes" style="margin-top:20px">

				<p:dataTable id="patientTable" value="#{patientBean.patients}"
					var="patient" paginator="true" rows="5" selectionMode="single"
					selection="#{patientBean.patient}" rowKey="#{patient.id}">

					<p:column headerText="ID">
						<h:outputText value="#{patient.id}" />
					</p:column>

					<p:column headerText="Nome">
						<h:outputText value="#{patient.fullName}" />
					</p:column>

					<p:column headerText="Nascimento">
						<h:outputText value="#{patient.dateOfBirthFormatted}" />
					</p:column>

					<p:column headerText="Ações">
						<p:commandButton id="editar" value="Editar" icon="pi pi-pencil"
							style="margin-right: 10px !important;" action="#{patientBean.edit(patient)}"
							process="@this"
							update=":patientForm:name :patientForm:birth :patientForm:messages" />

						<p:commandButton id="calcularIdade" value="Calcular idade"
							icon="pi pi-calendar" style="margin-right: 10px !important;"
							action="#{patientBean.calculateAge(patient)}" process="@this"
							update=":patientForm:ageDialog"
							oncomplete="PF('ageDialog').show();" />

					</p:column>

				</p:dataTable>

			</p:panel>

			<p:dialog id="ageDialog" widgetVar="ageDialog"
				header="Idade do Paciente" modal="true" closable="true"
				resizable="false">

				<h:panelGroup id="ageContent">

					<h2>Idade calculada: #{patientBean.calculatedAge} anos</h2>

				</h:panelGroup>

			</p:dialog>

		</h:form>

	</ui:define>

</ui:composition>
