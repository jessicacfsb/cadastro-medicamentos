<!DOCTYPE html>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	template="/templates/template-sistema.xhtml">

	<ui:define name="content">

		<h:form>
		    <h:body style="margin: 0; padding: 0; background-color: #f4f4f9;">
		        <div style="display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; width: 100%; padding-top: 2rem; box-sizing: border-box;">
		            <p:card style="width: 40%; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top-left-radius: 10px; border-top-right-radius: 10px;">
		                <f:facet name="header">
		                    <h:graphicImage library="imagens" name="image-med.avif" alt="Header Medicamento" style="width: 100%; max-width: 100%; height: auto; display: block; border-top-left-radius: 10px; border-top-right-radius: 10px;" />
		                </f:facet>
		                <f:facet name="title" style="display: flex; justify-content: center; align-items: center; margin-bottom: 1rem;">
		                    <h2 style="text-align: center;">Sistema de cadastro de medicamentos</h2>
		                </f:facet>
		
		                <p style="text-align: center;">
		                    <p:outputLabel value="#{indexBean.descricao}" />
		                </p>
		                <div style="text-align: center; margin-top: 1rem;">
		                    <p:commandButton id="btnRedirect" value="Cadastrar" style="display: block; margin: 0 auto;" action="#{indexBean.redirectPacientes}" />
		                </div>
		            </p:card>
		        </div>
		    </h:body>
		</h:form>

	</ui:define>

</ui:composition>
